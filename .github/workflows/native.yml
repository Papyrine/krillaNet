name: native

# Cross-compiles krilla-capi for every shipped RID and uploads one artifact per target.
# Called by publish-nuget.yml, and runnable on its own to check the matrix without releasing.
#
# Eight legs produce a cdylib the .NET loader opens by name. The ninth, browser-wasm, produces
# a STATIC archive instead, because WebAssembly has no loader to open one — it is linked into
# the consumer's own .wasm module by their build. See src/Krilla.Native.props.
#
# The RID list here is duplicated in src/Krilla.Native.props (the MSBuild table) and readme.md
# (documented support). All three must be kept in sync.
#
# Each leg ends with a static check of its own output. These matter because every failure they
# catch is invisible on the machine that produced the binary and only appears on a consumer's,
# as a bare DllNotFoundException:
#
#   * glibc  — a plain build on ubuntu-latest emits references to the runner's glibc (2.39),
#              which will not load on Debian 12, RHEL 9, or any runtime-deps:8.0 image.
#   * MSVC   — the default dynamic CRT makes the DLL import VCRUNTIME140.dll, which is not
#              present on a clean Windows install.
#   * musl   — Rust's musl targets default to +crt-static, which links musl *into* the .so and
#              gives the process two allocators and two TLS arenas.
#   * arm64  — macOS refuses to load unsigned arm64 code.
#   * wasm   — the archive is compiled with panic = "unwind", which rustc implements on this
#              target with NATIVE WebAssembly exception handling. A link that does not enable
#              it fails on an undefined __cpp_exception, and nothing readable off the .a says
#              so — hence a leg that actually links and runs the thing.

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            file: krilla_capi.dll

          - rid: win-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            file: krilla_capi.dll

          # glibc 2.17 is the RHEL 7 floor, comfortably below every supported distribution and
          # matching what .NET itself targets. zigbuild links against bundled glibc stubs for
          # the requested version, so this needs no container and no QEMU.
          - rid: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
            file: libkrilla_capi.so

          - rid: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig-target: aarch64-unknown-linux-gnu.2.17
            file: libkrilla_capi.so

          # .NET's RID graph does not fall back linux-musl-* to linux-*, so without these an
          # Alpine container fails with no diagnostic pointing at the libc.
          - rid: linux-musl-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig-target: x86_64-unknown-linux-musl
            file: libkrilla_capi.so

          - rid: linux-musl-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig-target: aarch64-unknown-linux-musl
            file: libkrilla_capi.so

          # Per-arch rather than a lipo'd universal binary: NuGet wants separate RID slots, so
          # a universal file would double the package size for nothing.
          - rid: osx-x64
            os: macos-15
            target: x86_64-apple-darwin
            file: libkrilla_capi.dylib

          - rid: osx-arm64
            os: macos-15
            target: aarch64-apple-darwin
            file: libkrilla_capi.dylib

          # Not a ninth platform so much as a different kind of artifact. The emscripten
          # version is pinned to the one the .NET wasm workload carries: the consumer's own
          # link step runs THAT emcc over this archive, so the two have to agree. Bump it in
          # step with the workload, not independently — the current value comes from
          # sdk-manifests/<ver>/microsoft.net.workload.emscripten.current.
          - rid: browser-wasm
            os: ubuntu-latest
            target: wasm32-unknown-emscripten
            file: krilla_capi.a
            emsdk: 3.1.56

    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.rid }}

      # install-action carries a manifest for cargo-zigbuild but none for zig itself, and its
      # cargo-binstall fallback then looks for a crates.io crate called `zig`, which does not
      # exist — so asking it for both fails the leg before it builds anything. Zig comes from
      # setup-zig instead, which is what cargo-zigbuild's own CI uses. The version is pinned
      # because zig supplies the linker and the bundled glibc stubs: it is part of what the
      # shipped binary is built from, the same reason the Rust dependencies are pinned exactly.
      - name: Install cargo-zigbuild
        if: matrix.zig-target != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        if: matrix.zig-target != ''
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
          cache-key: ${{ matrix.rid }}

      # -- Build ---------------------------------------------------------------------------

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: rust
        # +crt-static costs ~140 KB and removes the VCRUNTIME140.dll import. It also gives the
        # DLL its own heap, which is why every allocation crossing the ABI must be freed by the
        # side that made it — see docs rule R2 in crates/krilla-capi/src/handle.rs.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install emsdk
        if: matrix.emsdk != ''
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: ${{ matrix.emsdk }}
          actions-cache-folder: emsdk-${{ matrix.emsdk }}

      # zig-target rather than runner.os: the browser-wasm leg also runs on Linux and must not
      # go through cargo-zigbuild.
      - name: Build (Linux)
        if: runner.os == 'Linux' && matrix.zig-target != ''
        working-directory: rust
        # -crt-static on musl so the cdylib links the host's libc rather than embedding its
        # own. A fully static musl .so loaded into a musl process means two libcs in one
        # address space: it appears to work, then corrupts the heap.
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || '' }}
        run: cargo zigbuild --release --locked --target ${{ matrix.zig-target }}

      # `cargo rustc --crate-type` rather than adding staticlib to the crate's own
      # crate-type list. Doing it in Cargo.toml would make every one of the other eight legs —
      # and every local `cargo build` — link a second artifact under fat LTO for nothing.
      - name: Build (WebAssembly)
        if: matrix.emsdk != ''
        working-directory: rust
        run: cargo rustc -p krilla-capi --release --locked --target ${{ matrix.target }} --crate-type staticlib

      # Not a build flag, because it cannot be one: both features are implied by LLVM rather
      # than chosen, and rustup's precompiled std and compiler_builtins carry them however this
      # crate is compiled. So the declarations come off the finished archive instead. The
      # script explains why they are REMOVED rather than marked disallowed -- marking them
      # fixes Emscripten 3.1.56 and breaks 6.0.2, which is the trap this whole step is about.
      - name: Name the archive for its P/Invoke module, and lower it to the 3.1.56 baseline
        if: matrix.emsdk != ''
        working-directory: rust
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"

          # cargo emits libkrilla_capi.a. The WebAssembly SDK reads the P/Invoke module name
          # off the FILE NAME and does not strip the `lib` prefix, so shipping cargo's name
          # registers the module as `libkrilla_capi`, matches no DllImport in this package,
          # and lets wasm-ld strip the entire archive as unreferenced -- a build that succeeds
          # and a first P/Invoke that does not. Renaming is the whole fix.
          mv "$out/libkrilla_capi.a" "$out/${{ matrix.file }}"

          python3 ../.github/scripts/wasm-baseline-features.py "$out/${{ matrix.file }}" emar

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: rust
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --locked --target ${{ matrix.target }}

      # -- Verify --------------------------------------------------------------------------

      - name: Check Windows imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lib = "rust/target/${{ matrix.target }}/release/${{ matrix.file }}"
          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -Last 1
          $imports = & $dumpbin.FullName /dependents $lib
          Write-Host ($imports -join "`n")
          if ($imports -match 'VCRUNTIME|MSVCP|api-ms-win-crt') {
            throw "The DLL imports the dynamic CRT. +crt-static was not applied; consumers without the VC++ redistributable will see a DllNotFoundException."
          }

      - name: Check glibc floor
        # zig-target rather than runner.os, for the same reason the build step above uses it:
        # the browser-wasm leg is also a Linux runner, and objdump has nothing to say about a
        # wasm archive — under `set -o pipefail` the grep below would fail the leg outright.
        if: matrix.zig-target != '' && !contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          # cargo-zigbuild strips the glibc suffix for the output directory: a
          # `--target x86_64-unknown-linux-gnu.2.17` build lands in
          # target/x86_64-unknown-linux-gnu/release/, since it is the same rustc target.
          lib="rust/target/${{ matrix.target }}/release/${{ matrix.file }}"
          echo "Versioned symbol references:"
          objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -u

          # The assertion is "nothing above 2.17", not "the highest is exactly 2.17" — a
          # library that happens to need only 2.2.5 is perfectly fine and must not fail here.
          highest=$(objdump -T "$lib" | grep -oP 'GLIBC_\K[0-9.]+' | sort -uV | tail -1)
          echo "Highest required glibc: ${highest:-none}"

          if [ -n "$highest" ] && [ "$(printf '%s\n2.17\n' "$highest" | sort -V | tail -1)" != "2.17" ]; then
            echo "::error::the library requires glibc $highest and will not load on older distributions; the zigbuild target suffix did not take effect"
            exit 1
          fi

      - name: Check musl linkage
        if: contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          # cargo-zigbuild strips the glibc suffix for the output directory: a
          # `--target x86_64-unknown-linux-gnu.2.17` build lands in
          # target/x86_64-unknown-linux-gnu/release/, since it is the same rustc target.
          lib="rust/target/${{ matrix.target }}/release/${{ matrix.file }}"
          # A statically linked musl cdylib has no NEEDED entry for libc. That is the failure
          # mode this check exists to catch, since it is silent until the heap corrupts.
          if ! objdump -p "$lib" | grep -q 'NEEDED.*libc'; then
            echo "::error::the musl build statically linked libc; it must link the host's musl instead"
            exit 1
          fi

      - name: Check macOS signature
        # arm64 only, and that is not an oversight. The requirement belongs to arm64 — macOS
        # refuses to load unsigned arm64 code — and the linker ad-hoc signs on exactly that
        # basis, so the x86_64 leg built on the same Apple Silicon runner comes out unsigned
        # and is perfectly loadable, natively on Intel and under Rosetta. Running the check
        # against x86_64 fails every time and says nothing about the binary.
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          lib="rust/target/${{ matrix.target }}/release/${{ matrix.file }}"
          # rustc ad-hoc signs arm64 output, but verify rather than assume: arm64 macOS
          # refuses to load unsigned code outright.
          codesign -dv "$lib" 2>&1 || {
            echo "::error::the dylib is unsigned and will not load on Apple Silicon"
            exit 1
          }
          otool -l "$lib" | grep -A 3 LC_BUILD_VERSION || true

      - name: Check the WebAssembly archive links and runs
        if: matrix.emsdk != ''
        working-directory: rust
        # Every other leg can assert on its output statically. This one cannot: whether the
        # archive is usable is a property of the LINK, not of the file. So the check builds a
        # C driver against it with the same exception setting .NET uses, runs the result under
        # node, and asserts on what it prints.
        #
        # It is also the only leg that proves krilla WORKS on its target rather than merely
        # compiles for it -- the driver serializes a document and the check greps for the PDF
        # magic. Cheap here, because emcc and node are already installed for the build.
        run: |
          set -euo pipefail
          # Absolute, because the driver is built in a scratch directory: this check should
          # leave nothing behind in the tree it is checking.
          lib="$PWD/target/${{ matrix.target }}/release/${{ matrix.file }}"
          cd "$(mktemp -d)"

          cat > smoke.c <<'DRIVER'
          #include <stdint.h>
          #include <stddef.h>
          #include <stdio.h>

          typedef struct KrillaDocument KrillaDocument;
          extern uint32_t krilla_abi_version(void);
          extern size_t   krilla_abi_sizeof(int kind);
          extern int32_t  krilla_document_new(KrillaDocument** out);
          extern int32_t  krilla_document_finish(KrillaDocument* doc, uint8_t** out_ptr, size_t* out_len, void** out_error);
          extern int32_t  krilla_document_free(KrillaDocument* doc);
          extern int32_t  krilla_buffer_free(uint8_t* ptr, size_t len);

          int main(void) {
              uint8_t* buf = 0; size_t len = 0; void* err = 0;
              KrillaDocument* doc = 0;

              printf("pointer-size %zu\n", sizeof(void*));
              printf("abi-version %u\n", krilla_abi_version());
              printf("sizeof-stroke %zu\n", krilla_abi_sizeof(6));

              if (krilla_document_new(&doc) != 0) { printf("new-failed\n"); return 1; }
              if (krilla_document_finish(doc, &buf, &len, &err) != 0) { printf("finish-failed\n"); return 1; }
              if (len >= 5) printf("magic %c%c%c%c%c\n", buf[0], buf[1], buf[2], buf[3], buf[4]);

              krilla_buffer_free(buf, len);
              krilla_document_free(doc);
              return 0;
          }
          DRIVER

          # -fwasm-exceptions is what .NET's own wasm link does, since
          # WasmEnableExceptionHandling defaults to true. Dropping it here reproduces exactly
          # what a consumer who switches that off sees: wasm-ld failing on an undefined
          # __cpp_exception, from an archive that is otherwise perfectly good.
          # -O2 is load-bearing, not thoroughness. It is what makes emcc run wasm-opt, and
          # wasm-opt is where an archive declaring a feature the consumer's binaryen has never
          # heard of brings the build down. At -O0 the step is skipped entirely and this check
          # passes over exactly the failure that reaches every consumer.
          emcc smoke.c "$lib" -fwasm-exceptions -O2 -o smoke.js
          output=$(node smoke.js)
          echo "$output"

          # 32-bit, and the only shipped target that is. The managed mirrors spell the pointer
          # fields IntPtr and nuint so they follow automatically; a 64-bit answer here would
          # mean the leg built for the wrong target and one side of the ABI would be wrong.
          grep -qx "pointer-size 4" <<< "$output" || { echo "::error::not a 32-bit build"; exit 1; }
          grep -qx "sizeof-stroke 32" <<< "$output" || { echo "::error::KrillaStroke is not the 32-bit layout the managed mirror expects"; exit 1; }
          grep -qx "magic %PDF-" <<< "$output" || { echo "::error::the archive linked but krilla produced no PDF"; exit 1; }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: rust/target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7
