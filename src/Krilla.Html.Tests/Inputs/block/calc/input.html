<div id="frame">
  <div id="mixed">a percentage with a length taken off it</div>
  <div id="absolute">two absolute terms, which fold to one length</div>
  <div id="proportion">a percentage divided by a number</div>
  <div id="nested">a nested calc, multiplied out</div>
  <div id="clamped">narrower than nothing, floored at zero</div>
  <div id="padded">padding from a calc, and a width beside it</div>
  <div id="tall">a height from a calc</div>
  <div id="shifted">a left margin from a calc</div>
</div>
