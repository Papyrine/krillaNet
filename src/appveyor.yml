# Fast Windows feedback, not the release build.
#
# AppVeyor is Windows-only, so it cannot produce the shipped RID set. It builds win-x64 itself
# rather than downloading a GitHub Actions artifact, which keeps it self-contained — no
# cross-CI token, no ordering coupling — and makes every push a check that the Rust side still
# compiles.
#
# The nupkg dropped as an artifact below therefore carries win-x64 ONLY and must never be
# published. The release natives come from the eight-leg matrix in .github/workflows/native.yml,
# the only place that can cross-compile the other seven and pin the glibc floor. With nuget.org
# Trusted Publishing there is no API key in existence to publish this artifact with, which is
# the real safeguard; this comment is the reminder.
image: Visual Studio 2022
environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CARGO_TERM_COLOR: always
cache:
- rust\target -> rust\Cargo.lock
- '%USERPROFILE%\.cargo\registry -> rust\Cargo.lock'
build_script:
# The VS2022 image ships rustup; update rather than install so the toolchain matches
# rust/rust-toolchain.toml.
- rustup update stable --no-self-update
- rustc --version
# +crt-static removes the VCRUNTIME140.dll import, which is not present on a clean Windows
# install. Matches what native.yml does for the same target.
- pwsh: |
    $env:RUSTFLAGS = '-C target-feature=+crt-static'
    cargo build --release --locked --manifest-path rust/Cargo.toml --target x86_64-pc-windows-msvc
    if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
- cargo fmt --check --manifest-path rust/Cargo.toml
- cargo test --locked --manifest-path rust/Cargo.toml
- appveyor DownloadFile https://dot.net/v1/dotnet-install.ps1
- pwsh: ./dotnet-install.ps1 -JSonFile global.json -Architecture x64 -InstallDir 'C:\Program Files\dotnet'
# KrillaSkipCargo: the native was just built above with the correct RUSTFLAGS. Letting MSBuild
# shell out to cargo again would rebuild it without +crt-static.
- dotnet build src --configuration Release -p:KrillaSkipCargo=true
- dotnet build IntegrationTests --configuration Release
- dotnet run --project src/Krilla.Tests --configuration Release --no-build -- --report-trx
- dotnet run --project IntegrationTests/IntegrationTests --configuration Release --no-build -- --report-trx
on_failure:
  - ps: |
      $root = (Get-Location).Path
      Get-ChildItem *.received.* -Recurse | % {
        $rel = $_.FullName.Substring($root.Length + 1)
        Push-AppveyorArtifact $_.FullName -FileName $rel
      }
test: off
on_finish:
- pwsh: |
    $url = "https://ci.appveyor.com/api/testresults/mstest/$env:APPVEYOR_JOB_ID"
    $client = [System.Net.WebClient]::new()
    foreach ($trx in Get-ChildItem -Recurse -Filter *.trx -ErrorAction SilentlyContinue)
    {
      Write-Host "Uploading $($trx.FullName)"
      $client.UploadFile($url, $trx.FullName)
    }
artifacts:
- path: nugets\*.nupkg
